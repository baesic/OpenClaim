name: Deploy service distribution page
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'data/**', 'crates/**', 'skills/**', 'examples/**', 'docs/**', 'README.md', 'SECURITY.md', 'Cargo.toml', 'Cargo.lock', 'scripts/build-web.sh', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test --locked -p openclaim-core
      - run: cargo install wasm-bindgen-cli --version 0.2.121 --locked
      - run: bash scripts/build-web.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
